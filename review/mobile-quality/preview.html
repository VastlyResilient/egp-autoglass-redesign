<!doctype html><html lang="en"><meta charset="utf-8"><title>EGP mobile motion audit</title><style>body{margin:0;font:13px system-ui;background:#eee}nav{display:flex;flex-wrap:wrap;gap:6px;padding:6px}iframe{border:0;transform:scale(1);transform-origin:0 0}textarea{display:none;position:relative;width:95%;height:200px;font:10px monospace}#status{display:block}</style><nav><select id="size"><option value="390,844">Phone390</option><option value="320,568">Small320</option><option value="844,390">Landscape</option><option value="820,1180">Tablet</option><option value="1440,900">Desktop</option></select><select id="route"></select><select id="scene"><option>hero</option><option>assembly</option><option>horizontal</option><option>proof</option><option>orbit</option><option>ticker</option><option>globe</option><option>projects</option><option>footer</option></select><button data-p="0">Start</button><button data-p=".15">First</button><button data-p=".35">Second</button><button data-p=".55">Third</button><button data-p=".75">Fourth</button><button data-p="1">End</button><button id="all">Audit all routes</button><button id="home">Audit home</button></nav><output id="status">Ready</output><iframe title="Test website" width="390" height="844" src="../../index.html"></iframe><textarea aria-label="Audit results" readonly></textarea><script>
const f=document.querySelector('iframe'),out=document.querySelector('textarea'),status=document.querySelector('#status'),routes=['index','about-us','services','guides','auto-glass-replacement','auto-glass-repair','insurance-claims','instant-quote','order-status','contact-us','privacy','404'];route.innerHTML=routes.map(r=>`<option>${r}</option>`).join('');const delay=ms=>new Promise(r=>setTimeout(r,ms));const doc=()=>f.contentDocument,win=()=>f.contentWindow;function scroll(y){win().scrollTo({top:y,behavior:'instant'})}function documentY(e){return e.getBoundingClientRect().top+win().scrollY}async function load(r){await new Promise(resolve=>{f.onload=resolve;f.src='../../'+r+'.html'});await delay(150)}size.onchange=()=>{[f.width,f.height]=size.value.split(',')};route.onchange=()=>load(route.value);
function getScene(){return doc().querySelector(`[data-scene="${scene.value}"]`)||doc().querySelector(({ticker:'.ticker',globe:'.globe-stage',projects:'.project-grid',footer:'.footer'})[scene.value])}
function seek(e,p){if(e.dataset.scene==='proof')scroll(documentY(e)-f.clientHeight*.8+p*f.clientHeight*.65);else if(e.hasAttribute('data-scene'))scroll(documentY(e)+p*(e.offsetHeight-f.clientHeight));else scroll(documentY(e)-100)}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const e=getScene();if(e)seek(e,+b.dataset.p)});
function snap(e){const w=win(),cs=x=>w.getComputedStyle(x),r=e.getBoundingClientRect();return {type:e.dataset.scene,p:e.style.getPropertyValue('--p'),top:r.top,frame:e.querySelector('[data-film]')?.dataset.frame,beats:[...e.querySelectorAll('[data-beat]')].map(x=>+cs(x).opacity),cards:[...e.querySelectorAll('.assembly-card')].map(x=>({opacity:cs(x).opacity,inert:x.inert,transform:cs(x).transform})),travel:e.querySelector('.horizontal-track')?.style.getPropertyValue('--travel'),fill:[...e.querySelectorAll('.feature-card')].map(x=>x.style.getPropertyValue('--fill')),rail:e.querySelector('.proof-track')?.style.transform,orbit:[...e.querySelectorAll('.orbit-item')].map(x=>({x:x.style.getPropertyValue('--x'),y:x.style.getPropertyValue('--y'),inert:x.inert})),copy:e.style.getPropertyValue('--copy')}}
async function audit(list){const result={viewport:size.value,routes:[]};for(const r of list){status.textContent='Testing '+r;await load(r);const item={route:r,overflow:doc().documentElement.scrollWidth>f.clientWidth,reveals:[],scenes:[],disclosures:[]};for(const e of doc().querySelectorAll('[data-reveal]')){scroll(Math.max(0,documentY(e)-f.clientHeight*.6));await delay(220);item.reveals.push({text:e.textContent.trim().slice(0,45),opacity:+win().getComputedStyle(e).opacity})}for(const e of doc().querySelectorAll('[data-scene]')){const samples=[];for(const p of [0,.15,.35,.55,.75,1,.55,.15,0]){seek(e,p);await delay(e.dataset.scene==='hero'?300:100);samples.push(snap(e))}item.scenes.push(samples)}for(const d of doc().querySelectorAll('details')){d.querySelector('summary').click();item.disclosures.push(d.open&&d.querySelector('p').getBoundingClientRect().height>0);d.querySelector('summary').click()}result.routes.push(item);out.value=JSON.stringify(result,null,2)}status.textContent='Complete '+list.length+' routes';}all.onclick=()=>audit(routes);home.onclick=()=>audit(['index']);
</script></html>
