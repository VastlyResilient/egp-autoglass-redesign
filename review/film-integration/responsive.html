<!doctype html><html lang="en"><meta charset="utf-8"><title>EGP responsive verification</title><style>body{overflow:hidden;margin:0;background:#e6e6e6;font:14px system-ui}nav{height:38px;display:flex;gap:8px;align-items:center}iframe{border:0;display:block;transform:scale(.7);transform-origin:top left}button{padding:5px}</style><nav><button data-size="1440,900">Desktop</button><button data-size="390,844">Phone</button><button data-size="390,600">Short phone</button><button data-size="820,1180">Tablet</button><button data-p="0">Start</button><button data-p=".2">Early</button><button data-p=".5">Middle</button><button data-p=".9">End</button><button id="below">Below film</button></nav><iframe title="EGP live responsive page" src="../../index.html" width="390" height="844"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');f.width=w;f.height=h;f.contentWindow.location.reload()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const e=f.contentDocument.querySelector('.hero-track');f.contentWindow.scrollTo(0,(e.offsetHeight-f.clientHeight)*Number(b.dataset.p))});document.querySelector('#below').onclick=()=>f.contentWindow.scrollTo(0,f.contentDocument.querySelector('.hero-track').offsetHeight);</script></html>
